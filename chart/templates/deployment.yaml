apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.postgres.name}}
  labels:
    app: {{ .Values.postgres.app }}
spec:
  replicas: {{ .Values.postgres.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.postgres.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.postgres.app }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        {{- if and (not .Values.postgres.openshift) (not (.Capabilities.APIVersions.Has "security.openshift.io/v1")) }}
        {{- if .Values.postgres.fsGroup }}
        fsGroup: {{ .Values.postgres.fsGroup }}
        {{- end }}
        {{- end }}
      automountServiceAccountToken: false
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        {{- if .Values.initSchema.enabled }}
        - name: postgres-schema
          configMap:
            name: postgres-schema
        {{- end }}
      containers:
        - name: {{ .Values.postgres.name }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.postgres.image }}:{{ .Values.postgres.tag }}"
          imagePullPolicy: {{ .Values.postgres.pullPolicy }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
              name: {{ .Values.postgres.name }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.db | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
          volumeMounts:
            - name: postgres-storage
              mountPath: /tmp
            {{- if .Values.initSchema.enabled }}
            - name: postgres-schema
              mountPath: /docker-entrypoint-initdb.d/schema.sql
              subPath: schema.sql
            {{- end }}
