app:
  name: postgres
  replicaCount: 1
  resources:
    limits:
      cpu: 100m
      memory: 200Mi
  image: ghcr.io/joeckr/postgres
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  port: 5432
  db: postgres
  user: postgres
  podAnnotations: {}
  storageAccessMode: ReadWriteOnce
  storageSize: 1Gi
  storageClass: ""
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 1031
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

initSchema:
  enabled: false

secret:
  # Set create: false or provide existingSecret when managing secrets externally (e.g. External Secrets Operator).
  create: true
  existingSecret: ""
  keys:
    password: "POSTGRES_PASSWORD"  # betterleaks:allow
  data:
    POSTGRES_PASSWORD: "changeme"  # betterleaks:allow
